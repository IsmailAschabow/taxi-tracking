<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Fahrten-Übersicht</title>
  <style>
    :root {
      --bg:#f7f8fa; --card:#fff; --border:#e5e7eb; --text:#0f172a; --muted:#94a3b8;
      --sub:#475569; --accent:#0f172a; --green:#059669; --greenbg:rgba(5,150,105,.10);
      --blue:#2563eb; --bluebg:rgba(37,99,235,.10); --indigo:#4f46e5; --indigobg:rgba(79,70,229,.10);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg); color:var(--text); min-height:100vh; padding:32px 44px; }
    .wrap { width:100%; }
    .brand { font-size:13px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
      color:var(--muted); margin-bottom:24px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:28px; flex-wrap:wrap; }
    .logo { height:120px; width:auto; }
    .topbar-sub { font-size:28px; font-weight:700; color:var(--text); }
    .layout { display:flex; gap:36px; align-items:flex-start; flex-wrap:wrap; }
    .cal { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px;
      width:400px; flex:0 0 auto; }
    .main { flex:1 1 520px; min-width:0; }

    .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .cal-title { font-size:19px; font-weight:700; }
    .cal-nav { background:var(--bg); border:1px solid var(--border); border-radius:8px; width:40px; height:40px;
      font-size:20px; cursor:pointer; color:var(--sub); }
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
    .cal-dow { text-align:center; font-size:13px; font-weight:600; color:var(--muted); padding:6px 0; }
    .cal-day { position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center;
      font-size:16px; border-radius:10px; cursor:pointer; color:var(--text); border:1px solid transparent; }
    .cal-day.other { color:var(--muted); opacity:.5; }
    .cal-day.today { border-color:var(--accent); }
    .cal-day.selected { background:var(--accent); color:#fff; font-weight:700; }
    .cal-day .dot { position:absolute; bottom:4px; width:5px; height:5px; border-radius:50%; background:var(--green); }
    .cal-day.selected .dot { background:#fff; }

    .day-title { font-size:24px; font-weight:700; margin-bottom:4px; }
    .day-sub { font-size:15px; color:var(--muted); margin-bottom:20px; }
    .cards { display:flex; flex-wrap:wrap; gap:18px; }
    .ride { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:22px;
      width:300px; cursor:pointer; transition:box-shadow .15s; }
    .ride:hover { box-shadow:0 4px 14px rgba(0,0,0,.10); }
    .ride .time { font-size:14px; color:var(--muted); margin-bottom:8px; }
    .ride .name { font-size:20px; font-weight:700; margin-bottom:14px; }
    .pill { display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:600;
      padding:6px 14px; border-radius:20px; }
    .pill .pdot { width:6px; height:6px; border-radius:50%; }
    .st-angenommen { background:var(--bluebg); color:var(--blue); }
    .st-unterwegs  { background:rgba(15,23,42,.07); color:var(--accent); }
    .st-angekommen { background:var(--greenbg); color:var(--green); }
    .st-an_bord { background:var(--indigobg); color:var(--indigo); }
    .st-abgeschlossen { background:var(--greenbg); color:var(--green); }
    .empty { color:var(--muted); font-size:14px; padding:24px 0; }
    .loading { color:var(--muted); font-size:14px; padding:24px 0; }

    /* ---- Erinnerung "Link bereits versendet?" ---- */
    .remind { margin-top:16px; padding-top:14px; border-top:1px solid var(--border); cursor:default; }
    .remind-q { font-size:13px; font-weight:600; color:var(--sub); margin-bottom:8px; }
    .yn { display:flex; gap:8px; }
    .yn-b { flex:1; border:1px solid var(--border); background:var(--card); color:var(--sub); border-radius:8px;
      padding:8px 0; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
    .yn-b.on.yes { background:var(--green); border-color:var(--green); color:#fff; }
    .yn-b.on.no { background:#fef3c7; border-color:#f59e0b; color:#b45309; }
    .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#dc2626; color:#fff;
      padding:12px 18px; border-radius:10px; font-size:14px; font-weight:600; z-index:20; }

    /* ---- Popup ---- */
    .overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
      align-items:flex-start; justify-content:center; padding:24px 16px; overflow-y:auto; z-index:10; }
    .overlay.show { display:flex; }
    .modal { background:var(--bg); border-radius:16px; width:100%; max-width:440px; padding:16px; position:relative; }
    .close { position:absolute; top:10px; right:10px; width:34px; height:34px; border-radius:50%;
      border:none; background:var(--card); border:1px solid var(--border); font-size:18px; cursor:pointer; color:var(--sub); z-index:2; }
    .pcard { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:12px; }
    .steps { display:flex; align-items:flex-start; }
    .step { flex:1; display:flex; flex-direction:column; align-items:center; position:relative; }
    .step .sd { width:24px; height:24px; border-radius:50%; background:#e5e7eb; border:3px solid #e5e7eb; z-index:2;
      display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:700; }
    .step.done .sd { background:var(--green); border-color:var(--green); }
    .step .sb { position:absolute; top:10px; left:-50%; width:100%; height:4px; background:#e5e7eb; z-index:1; }
    .step:first-child .sb { display:none; }
    .step.done .sb { background:var(--green); }
    .step .sl { margin-top:8px; font-size:12px; font-weight:600; color:var(--muted); text-align:center; }
    .step.done .sl { color:var(--text); }
    .steps-title { font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
    .steps-gap { height:18px; }
    .drv { text-align:center; }
    .photo,.photo-fb { width:88px; height:88px; border-radius:50%; margin:0 auto 12px; object-fit:cover; border:3px solid var(--greenbg); }
    .photo-fb { background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:700; }
    .hello { font-size:20px; font-weight:700; }
    .hello-sub { font-size:14px; color:var(--sub); margin-top:3px; }
    .lbl { font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
    .summary { font-size:14px; line-height:1.55; }
    .route { display:flex; gap:12px; }
    .rl { display:flex; flex-direction:column; align-items:center; padding-top:4px; }
    .rl .d1 { width:10px; height:10px; border-radius:50%; background:var(--blue); }
    .rl .d2 { width:10px; height:10px; border-radius:50%; background:var(--green); }
    .rl .ln { width:2px; flex:1; min-height:20px; background:var(--border); }
    .rt { flex:1; display:flex; flex-direction:column; justify-content:space-between; gap:12px; }
    .rt .k { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
    .rt .v { font-size:15px; font-weight:600; }
    .pterm { width:100%; border-radius:10px; margin-top:14px; display:block; }
    .hint-right { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:10px;
      background:var(--accent); color:#fff; border-radius:10px; padding:11px 14px; font-size:14px; font-weight:800; letter-spacing:1px; }
    .call { display:block; text-decoration:none; text-align:center; background:var(--green); color:#fff;
      border-radius:12px; padding:14px; font-size:16px; font-weight:700; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="topbar-sub">Fahrten-Übersicht</div>
      <img class="logo" src="logo.webp" alt="Trip Companion" />
    </div>
    <div id="invalid" class="empty hidden">Dieser Link ist ungültig. Bitte wenden Sie sich an Ihren Fahrdienst.</div>
    <div class="day-title" id="dayTitle"></div>
    <div class="day-sub" id="daySub"></div>
    <div class="layout" id="layout">
      <div class="cal">
        <div class="cal-head">
          <button class="cal-nav" id="prevM">‹</button>
          <div class="cal-title" id="calTitle"></div>
          <button class="cal-nav" id="nextM">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
      <div class="main">
        <div id="listArea"><div class="loading">Fahrten werden geladen…</div></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- Popup (Gast-Ansicht) -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <button class="close" id="closeBtn">×</button>
      <div class="pcard">
        <div class="steps-title">Fahrer</div>
        <div class="steps" id="pSteps"></div>
        <div id="pGuestSteps" class="hidden">
          <div class="steps-gap"></div>
          <div class="steps-title">Gast</div>
          <div class="steps" id="pGSteps"></div>
        </div>
      </div>
      <div class="pcard drv hidden" id="pDriver">
        <div id="pPhoto"></div>
        <div class="hello" id="pHello"></div>
        <div class="hello-sub">Ich bin heute Ihr Fahrer.</div>
      </div>
      <div class="pcard hidden" id="pDetails">
        <div class="lbl">Fahrt im Überblick</div>
        <div class="summary" id="pSummary"></div>
      </div>
      <div class="pcard">
        <div class="lbl">Fahrt</div>
        <div class="route">
          <div class="rl"><div class="d1"></div><div class="ln"></div><div class="d2"></div></div>
          <div class="rt">
            <div><div class="k">Abholort</div><div class="v" id="pPickup"></div></div>
            <div><div class="k" id="pDestK">Zielort</div><div class="v" id="pDest"></div></div>
          </div>
        </div>
        <img id="pTermImg" class="pterm hidden" alt="Terminal" />
        <div id="pTermHint" class="hint-right hidden"><span>➜</span><span id="pTermHintText"></span></div>
      </div>
      <div class="pcard hidden" id="pContact">
        <div class="lbl">Kontakt zum Fahrer</div>
        <a class="call" id="pCall" href="#">Fahrer anrufen</a>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://apmaqbctnpxzkinmaiap.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwbWFxYmN0bnB4emtpbm1haWFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NjIxMzUsImV4cCI6MjA5MDQzODEzNX0.kpmLP9h-MCYJi954p1-s7dWvgFrAGGOy6V1KhlZZbTQ'
    const POLL_MS = 25000
    const DOW = ['Mo','Di','Mi','Do','Fr','Sa','So']
    const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember']
    const TERMINALS = {
      '1': { img: '../terminal1.jpg', hint: 'TO YOUR RIGHT' },
      '2': { img: '../terminal2.jpg', hint: 'TO YOUR RIGHT' },
    }
    const SEATS = { babyschale: 'Babyschale', kindersitz: 'Kindersitz', sitzerhoehung: 'Sitzerhöhung' }
    const API_HEADERS = { 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY, 'Content-Type':'application/json' }

    const $ = id => document.getElementById(id)
    function getToken() {
      const q = new URLSearchParams(location.search).get('token')
      if (q) return q
      const m = location.pathname.match(/\/p\/([^\/?#]+)/)
      return m ? decodeURIComponent(m[1]) : ''
    }
    const token = getToken()

    let orders = []
    let selected = startOfDay(new Date())
    let view = new Date(selected.getFullYear(), selected.getMonth(), 1)
    let openId = null

    function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()) }
    function dayKey(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate() }
    function fmtTime(iso){ return iso ? new Date(iso).toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'}) : '' }
    function fmtDateLong(d){ return DOW[(d.getDay()+6)%7]+', '+d.getDate()+'. '+MONTHS[d.getMonth()]+' '+d.getFullYear() }
    function statusLabel(s){ return {angenommen:'Angenommen',unterwegs:'Unterwegs',angekommen:'Angekommen',an_bord:'Gast an Bord',abgeschlossen:'Abgeschlossen'}[s] || s }
    function initials(n){ return (n||'').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase() || '·' }
    function withTerminal(loc, t){ return (loc || '—') + (t ? ' · Terminal ' + t : '') }

    // Telefonnummer immer mit Ländervorwahl (Standard +43).
    function intlPhone(raw){
      const s = String(raw || '').trim().replace(/\(0\)/g, '')
      const digits = s.replace(/\D/g, '')
      if (!digits) return ''
      if (s.startsWith('+')) return '+' + digits
      if (digits.startsWith('00')) return '+' + digits.slice(2)
      if (digits.startsWith('0')) return '+43' + digits.slice(1)
      if (/^(43|41|49|423)\d{8,}$/.test(digits)) return '+' + digits
      return '+43' + digits
    }

    // Fließtext: Anzahl Autos, Personen, Kinderausstattung (falls vorhanden).
    function rideSummary(o){
      const cars = Math.max(o.car_count || 1, 1)
      const pax = o.passenger_count || 0
      const luggage = o.luggage_cars || 0
      let t = 'Abholung mit ' + cars + (cars === 1 ? ' Fahrzeug' : ' Fahrzeugen')
      if (pax) t += ' für ' + pax + (pax === 1 ? ' Person' : ' Personen')
      t += '.'
      if (cars > 1 && luggage > 0) t += luggage === 1 ? ' Davon 1 Fahrzeug nur für das Gepäck.' : ' Davon ' + luggage + ' Fahrzeuge nur für das Gepäck.'
      const counts = {}
      ;(o.child_seats || []).forEach(s => { if (SEATS[s]) counts[s] = (counts[s] || 0) + 1 })
      const seats = Object.keys(counts).map(k => counts[k] + ' × ' + SEATS[k])
      if (seats.length) t += ' Kinderausstattung: ' + seats.join(', ') + '.'
      return t
    }

    function toast(msg){
      const t = $('toast'); t.textContent = msg; t.classList.remove('hidden')
      clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.add('hidden'), 4000)
    }

    async function fetchOrders(){
      try {
        const res = await fetch(SUPABASE_URL+'/rest/v1/rpc/get_partner_orders', {
          method:'POST',
          headers: API_HEADERS,
          body: JSON.stringify({ p_token: token })
        })
        if (!res.ok) return
        const rows = await res.json()
        if (!Array.isArray(rows)) return
        orders = rows
        renderAll()
      } catch(e) { /* nächster Poll */ }
    }

    // Reine Erinnerung fürs Hotel: wurde der Live-Link schon an den Gast weitergeleitet?
    async function setForwarded(o, value){
      const prev = !!o.link_forwarded
      o.link_forwarded = value
      renderList()
      try {
        const res = await fetch(SUPABASE_URL+'/rest/v1/rpc/set_partner_link_forwarded', {
          method:'POST',
          headers: API_HEADERS,
          body: JSON.stringify({ p_token: token, p_order_id: o.order_id, p_value: value })
        })
        if (!res.ok || (await res.json()) !== true) throw new Error('not saved')
      } catch(e) {
        o.link_forwarded = prev
        renderList()
        toast('Konnte nicht gespeichert werden. Bitte erneut versuchen.')
      }
    }

    function ordersForDay(d){
      const k = dayKey(d)
      return orders.filter(o => dayKey(new Date(o.scheduled_at)) === k)
                   .sort((a,b)=> new Date(a.scheduled_at)-new Date(b.scheduled_at))
    }

    function renderCalendar(){
      $('calTitle').textContent = MONTHS[view.getMonth()]+' '+view.getFullYear()
      const grid = $('calGrid'); grid.innerHTML = ''
      DOW.forEach(d => { const e=document.createElement('div'); e.className='cal-dow'; e.textContent=d; grid.appendChild(e) })
      const first = new Date(view.getFullYear(), view.getMonth(), 1)
      const offset = (first.getDay()+6)%7  // Mo=0
      const start = new Date(first); start.setDate(1-offset)
      const today = startOfDay(new Date())
      const daysWith = new Set(orders.map(o => dayKey(new Date(o.scheduled_at))))
      for (let i=0;i<42;i++){
        const d = new Date(start); d.setDate(start.getDate()+i)
        const cell = document.createElement('div')
        cell.className = 'cal-day'
        if (d.getMonth()!==view.getMonth()) cell.classList.add('other')
        if (dayKey(d)===dayKey(today)) cell.classList.add('today')
        if (dayKey(d)===dayKey(selected)) cell.classList.add('selected')
        cell.textContent = d.getDate()
        if (daysWith.has(dayKey(d))) { const dot=document.createElement('div'); dot.className='dot'; cell.appendChild(dot) }
        cell.onclick = () => { selected = startOfDay(d); view = new Date(d.getFullYear(), d.getMonth(), 1); renderAll() }
        grid.appendChild(cell)
      }
    }

    function renderList(){
      $('dayTitle').textContent = fmtDateLong(selected)
      const list = ordersForDay(selected)
      $('daySub').textContent = list.length ? (list.length===1?'1 Fahrt':list.length+' Fahrten') : ''
      const area = $('listArea')
      if (list.length===0){ area.innerHTML = '<div class="empty">Keine Fahrten an diesem Tag.</div>'; return }
      const cards = document.createElement('div'); cards.className='cards'
      list.forEach(o => {
        const c = document.createElement('div'); c.className='ride'
        const time = o.booking_type==='stunden' && o.scheduled_until
          ? fmtTime(o.scheduled_at)+' – '+fmtTime(o.scheduled_until) : fmtTime(o.scheduled_at)
        const t = document.createElement('div'); t.className = 'time'; t.textContent = time
        const n = document.createElement('div'); n.className = 'name'; n.textContent = o.passenger_name || 'Gast'
        const p = document.createElement('span'); p.className = 'pill st-' + o.status
        p.innerHTML = '<span class="pdot" style="background:currentColor"></span>'
        p.append(statusLabel(o.status))

        const r = document.createElement('div'); r.className = 'remind'
        r.innerHTML = '<div class="remind-q">Link bereits versendet?</div>'
          + '<div class="yn"><button class="yn-b yes'+(o.link_forwarded?' on':'')+'">Ja</button>'
          + '<button class="yn-b no'+(o.link_forwarded?'':' on')+'">Nein</button></div>'
        r.onclick = (e) => e.stopPropagation()
        r.querySelector('.yes').onclick = () => { if (!o.link_forwarded) setForwarded(o, true) }
        r.querySelector('.no').onclick = () => { if (o.link_forwarded) setForwarded(o, false) }

        c.append(t, n, p, r)
        c.onclick = () => openPopup(o.order_id)
        cards.appendChild(c)
      })
      area.innerHTML=''; area.appendChild(cards)
    }

    function renderAll(){
      renderCalendar(); renderList()
      if (openId){ const o = orders.find(x=>x.order_id===openId); if (o) fillPopup(o); else closePopup() }
    }

    function buildSteps(el, labels, reached){
      el.innerHTML=''
      labels.forEach((label, i) => {
        const step=document.createElement('div'); step.className='step'+(i+1<=reached?' done':'')
        step.innerHTML='<div class="sb"></div><div class="sd">✓</div><div class="sl"></div>'
        step.querySelector('.sl').textContent = label
        el.appendChild(step)
      })
    }

    function fillPopup(o){
      const stage = o.stage || 1
      buildSteps($('pSteps'), ['Informiert','Unterwegs','Angekommen'], Math.min(stage, 3))
      $('pGuestSteps').classList.toggle('hidden', stage < 3)
      buildSteps($('pGSteps'), ['An Bord','Angekommen'], Math.max(stage - 3, 0))

      const hasDriver = !!o.driver_first_name
      const phone = hasDriver ? intlPhone(o.driver_phone) : ''
      $('pDriver').classList.toggle('hidden', !hasDriver)
      $('pDetails').classList.toggle('hidden', !hasDriver)
      $('pContact').classList.toggle('hidden', !phone)
      if (hasDriver){
        $('pHello').textContent = 'Hallo, ich bin '+o.driver_first_name+'.'
        $('pSummary').textContent = rideSummary(o)
        const slot=$('pPhoto')
        const fallback = () => { const fb=document.createElement('div'); fb.className='photo-fb'; fb.textContent=initials(o.driver_first_name); slot.textContent=''; slot.appendChild(fb) }
        slot.textContent=''
        if (o.driver_photo_url){
          const img=document.createElement('img'); img.className='photo'; img.src=o.driver_photo_url
          img.onerror=fallback
          slot.appendChild(img)
        } else fallback()
        if (phone){ $('pCall').href='tel:'+phone; $('pCall').textContent='Fahrer anrufen · '+phone }
      }
      $('pPickup').textContent = withTerminal(o.pickup_location, o.terminal)
      if (o.booking_type==='stunden'){
        $('pDestK').textContent='Buchung'
        $('pDest').textContent='Stundenbuchung'+(o.scheduled_until?' ('+fmtTime(o.scheduled_at)+' – '+fmtTime(o.scheduled_until)+')':'')
      } else {
        $('pDestK').textContent='Zielort'
        $('pDest').textContent = o.destination || '—'
      }
      const term = TERMINALS[o.terminal]
      const ti=$('pTermImg')
      if (term){
        if (ti.getAttribute('src') !== term.img) ti.src = term.img
        ti.classList.remove('hidden')
        $('pTermHintText').textContent = term.hint
        $('pTermHint').classList.remove('hidden')
      } else {
        ti.classList.add('hidden')
        $('pTermHint').classList.add('hidden')
      }
    }

    function openPopup(id){ openId=id; const o=orders.find(x=>x.order_id===id); if(!o) return; fillPopup(o); $('overlay').classList.add('show') }
    function closePopup(){ openId=null; $('overlay').classList.remove('show') }

    $('prevM').onclick=()=>{ view=new Date(view.getFullYear(),view.getMonth()-1,1); renderCalendar() }
    $('nextM').onclick=()=>{ view=new Date(view.getFullYear(),view.getMonth()+1,1); renderCalendar() }
    $('closeBtn').onclick=closePopup
    $('overlay').onclick=(e)=>{ if(e.target===$('overlay')) closePopup() }

    if (!token){ $('layout').classList.add('hidden'); $('invalid').classList.remove('hidden') }
    else { fetchOrders(); setInterval(fetchOrders, POLL_MS) }
  </script>
</body>
</html>
